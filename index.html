<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de Soporte - IMP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --azul-fondo-profundo: #062b7a;
            --cian-neon: #00e5ff;
            --rosa-neon: rgba(255, 105, 180, 0.4);
            --lila-neon: rgba(147, 112, 219, 0.4);
            --blanco-cristal: rgba(255, 255, 255, 0.9);
            --texto-oscuro: #1a202c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--azul-fondo-profundo);
            background-image: 
                radial-gradient(circle at 15% 50%, var(--lila-neon), transparent 40%),
                radial-gradient(circle at 85% 30%, var(--rosa-neon), transparent 40%),
                radial-gradient(circle at 50% 80%, rgba(0, 229, 255, 0.2), transparent 50%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        form {
            background: var(--blanco-cristal);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), inset 0 0 0 1px rgba(255, 255, 255, 0.5);
            width: 100%;
            max-width: 480px;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        form:hover { transform: translateY(-8px); }

        .logo-container {
            text-align: center;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #0d3c9e, #062168);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(6, 43, 122, 0.4);
            border: 1px solid rgba(0, 229, 255, 0.3);
        }

        .logo-container img {
            max-width: 100%;
            height: auto;
            max-height: 90px;
        }

        h1 {
            font-size: 24px;
            text-align: center;
            color: var(--azul-fondo-profundo);
            margin-bottom: 20px;
            font-weight: 700;
        }

        label {
            display: block;
            margin-top: 15px;
            font-size: 13px;
            font-weight: 600;
            color: var(--texto-oscuro);
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
        }

        label i { color: #0077b6; font-size: 15px; }

        input, select, textarea {
            width: 100%;
            padding: 12px 15px;
            margin-top: 8px;
            border: 2px solid rgba(6, 43, 122, 0.1);
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
            background-color: rgba(255, 255, 255, 0.7);
            font-family: 'Outfit', sans-serif;
            color: var(--texto-oscuro);
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--cian-neon);
            background-color: #ffffff;
            outline: none;
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.4);
        }

        button {
            margin-top: 25px;
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #0044cc, #00b4d8);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        button:hover { box-shadow: 0 8px 25px rgba(0, 229, 255, 0.5); }
        button:disabled { background: #a0a0a0; cursor: not-allowed; }

        #estado {
            text-align: center;
            margin-top: 20px;
            font-weight: 600;
            font-size: 14px;
            padding: 12px;
            border-radius: 10px;
            display: none;
        }

        .oculto { display: none; }
        .bloque-animado { animation: slideDown 0.4s ease forwards; }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<!-- ⚠️ AQUÍ SE AGREGA EL ACTION Y TARGET AL FORMULARIO -->
<form id="formSoporte" action="https://script.google.com/macros/s/AKfycbz-WfMvAuynSsu9cFDZPz4wIlK_Ps41jh9k33sLH9-H3Nbq40U3rpepR-2LFNiT8-2cNQ/exec" method="POST" target="oculto">
    
    <div class="logo-container">
        <img src="impo.png" alt="Logo IMP">
    </div>

    <h1>Soporte Técnico</h1>

    <!-- ⚠️ SE AGREGA EL ATRIBUTO NAME A TODOS LOS INPUTS -->
    <label for="tipoUsuario"><i class="fa-solid fa-user-tag"></i> Soy:</label>
    <select id="tipoUsuario" name="tipo" required>
        <option value="">-- Selecciona una opción --</option>
        <option value="colaborador">Colaborador</option>
        <option value="alumno">Alumno / Docente</option>
    </select>

    <label for="nombre"><i class="fa-solid fa-user"></i> Nombre de quien solicita:</label>
    <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" required>

    <div id="bloqueColaborador" class="oculto">
        <label for="area"><i class="fa-solid fa-building"></i> Área o Departamento:</label>
        <input type="text" id="area" name="area" placeholder="Ej. Recursos Humanos">

        <label for="ubicacion"><i class="fa-solid fa-location-dot"></i> Ubicación exacta:</label>
        <input type="text" id="ubicacion" name="ubicacion" placeholder="Ej. Piso 2, Oficina 204">
    </div>

    <div id="bloqueAlumno" class="oculto">
        <label for="salon"><i class="fa-solid fa-chalkboard"></i> Salón:</label>
        <input type="text" id="salon" name="salon" placeholder="Ej. 3°B">

        <label for="plantel"><i class="fa-solid fa-school"></i> Plantel:</label>
        <select id="plantel" name="plantel">
            <option value="">-- Selecciona el Plantel --</option>
            <option>Montevideo 517</option>
            <option>Montevideo 613</option>
            <option>Montevideo 625</option>
            <option>Montevideo 635</option>
            <option>Montevideo Ahuehuetes</option>
        </select>
    </div>

    <label for="equipo"><i class="fa-solid fa-laptop-medical"></i> Tipo de problema:</label>
    <select id="equipo" name="equipo" required>
        <option value="">-- Selecciona el problema --</option>
        <option>Computadora</option>
        <option>Monitor / Pantalla</option>
        <option>Red / Internet</option>
        <option>Otro</option>
    </select>

    <label for="problema"><i class="fa-solid fa-comment-dots"></i> Descripción del problema:</label>
    <textarea id="problema" name="problema" rows="3" placeholder="Describe brevemente qué está fallando..." required></textarea>

    <button type="submit" id="btnEnviar">
        <span id="btnTexto">Enviar solicitud</span>
        <i class="fa-solid fa-paper-plane" id="btnIcono"></i>
        <div class="spinner" id="spinner"></div>
    </button>
    
    <div id="estado"></div>
</form>

<!-- ⚠️ ESTE IFRAME OCULTO EVITA QUE LA PÁGINA SE RECARGUE -->
<iframe name="oculto" id="oculto" style="display:none;"></iframe>

<script>
    const tipoUsuario       = document.getElementById('tipoUsuario');
    const bloqueColaborador = document.getElementById('bloqueColaborador');
    const bloqueAlumno      = document.getElementById('bloqueAlumno');
    const campoArea         = document.getElementById('area');
    const campoUbicacion    = document.getElementById('ubicacion');
    const campoSalon        = document.getElementById('salon');
    const campoPlantel      = document.getElementById('plantel');
    const btnEnviar         = document.getElementById('btnEnviar');
    const btnTexto          = document.getElementById('btnTexto');
    const btnIcono          = document.getElementById('btnIcono');
    const spinner           = document.getElementById('spinner');
    const estadoDiv         = document.getElementById('estado');

    tipoUsuario.addEventListener('change', function() {
        const valor = tipoUsuario.value;
        bloqueColaborador.classList.add('oculto');
        bloqueAlumno.classList.add('oculto');
        bloqueColaborador.classList.remove('bloque-animado');
        bloqueAlumno.classList.remove('bloque-animado');
        campoArea.required = false; campoUbicacion.required = false;
        campoSalon.required = false; campoPlantel.required = false;

        if (valor === 'colaborador') {
            bloqueColaborador.classList.remove('oculto');
            bloqueColaborador.classList.add('bloque-animado');
            campoArea.required = true; campoUbicacion.required = true;
        } else if (valor === 'alumno') {
            bloqueAlumno.classList.remove('oculto');
            bloqueAlumno.classList.add('bloque-animado');
            campoSalon.required = true; campoPlantel.required = true;
        }
    });

    // ⚠️ NUEVA LÓGICA DE ENVÍO (Sin fetch, usando el formulario tradicional)
    document.getElementById('formSoporte').addEventListener('submit', function(e) {
        // Ya NO hacemos e.preventDefault() para que el formulario se envíe de verdad al iframe

        // Estado de carga
        btnTexto.textContent = "Enviando...";
        btnIcono.style.display = "none";
        spinner.style.display = "block";
        btnEnviar.disabled = true;
        estadoDiv.style.display = "none";

        // Simulamos un tiempo de espera para mostrar el mensaje de éxito
        setTimeout(() => {
            estadoDiv.style.display = "block";
            estadoDiv.style.color = '#0f5132';
            estadoDiv.style.backgroundColor = '#d1e7dd';
            estadoDiv.innerHTML = '<i class="fa-solid fa-circle-check"></i> ¡Solicitud enviada con éxito!';
            
            document.getElementById('formSoporte').reset();
            bloqueColaborador.classList.add('oculto');
            bloqueAlumno.classList.add('oculto');
            
            btnTexto.textContent = "Enviar solicitud";
            btnIcono.style.display = "inline-block";
            spinner.style.display = "none";
            btnEnviar.disabled = false;
        }, 1500); // 1.5 segundos de espera
    });
</script>

</body>
</html>
